<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventod JavaScript</title>
</head>
<body>
    <h1>Eventos JavaScript</h1>

    <button id="btnMensagem">Clique aqui</button>
    
    <Script>

        document.querySelector("#btnMensagem").onclick = ()=> {
            alert("Este evento está totalmente no arquivo externo como uma arrow function")
        } 
    </Script>

</body>
</html>
