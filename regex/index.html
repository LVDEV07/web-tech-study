<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="conteudo">

            <h1 class="container-title">Laboratório de Regex</h1>

            <p>
                Digite nos campos abaixo para testar 5 validações diferentes em tempo real
            </p>

            <div class="inputs">
                <label for="email">E-mail (Ex: teste@email.com)</label>
                <input type="text" placeholder="Digite um e-mail" id="email">

                <label for="cep">CEP (Ex: 00000-000)</label>
                <input type="text" placeholder="00000-000" id="cep">

                <label for="telefone">Celular (Ex: (00) 00000-0000)</label>
                <input type="text" placeholder="(11) 98888-7777" id="telefone">

                <label for="numeros">Apenas Números (Ex: 1234567)</label>
                <input type="text" placeholder="Digite apenas números" id="numeros">

                <label for="nomes">Nome (apenas letras e espaços)</label>
                <input type="text" placeholder="Seu nome completo" id="nomes">
            </div>
        </div>
    </div>
</body>
</html>
